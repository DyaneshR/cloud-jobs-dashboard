# Reverse proxy: nginx (port 80, public) -> gunicorn (port 5000, local only)
# WebSocket upgrade headers are required or Socket.IO silently falls back
# to HTTP polling instead of a real live connection.

server {
    listen 80;
    server_name _;   # replace with your domain later if you get one

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Required for WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
